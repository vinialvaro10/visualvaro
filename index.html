<!DOCTYPE html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Telegraf';src:url('./fonts/PPTelegraf-Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Telegraf';src:url('./fonts/PPTelegraf-UltraBold.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'Telegraf';src:url('./fonts/PPTelegraf-UltraLight.otf') format('opentype');font-weight:200;font-display:swap}
html{scroll-behavior:smooth}
body{margin:0;background:#002963;font-family:'Telegraf',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#00AFEF;text-decoration:none}
a:hover{color:#B668FF}
::selection{background:#8D27E6;color:#fff}
img{max-width:100%}
@keyframes vvflutua{0%{transform:translateY(0)}50%{transform:translateY(-14px)}100%{transform:translateY(0)}}
@keyframes vvgira{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes vvtomada{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(8px,-5px) rotate(2deg)}55%{transform:translate(16px,3px) rotate(-1.5deg)}78%{transform:translate(5px,-2px) rotate(.8deg)}}
@keyframes vvcabo{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-10px,-6px) rotate(-2.4deg)}55%{transform:translate(-22px,4px) rotate(1.8deg)}78%{transform:translate(-6px,-2px) rotate(-1deg)}}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;background:#002963;color:#fff">

  <header style="background:#001B42;border-bottom:1px solid rgba(255,255,255,.12)">
    <div style="max-width:1240px;margin:0 auto;padding:22px clamp(20px,4vw,32px);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <img src="./assets/logo-branco-dg-web.png" alt="visualvaro design gráfico e web" style="height:clamp(30px,4.2vw,40px);width:auto;display:block">
      <button type="button" aria-label="Abrir menu" onClick="{{ alternarMenu }}" style="display:{{ displayHamb }};flex-direction:column;justify-content:center;gap:5px;width:48px;height:48px;padding:12px;background:none;border:none;cursor:pointer">
        <span style="display:block;height:2.5px;background:#fff;border-radius:2px"></span>
        <span style="display:block;height:2.5px;background:#fff;border-radius:2px"></span>
        <span style="display:block;height:2.5px;background:#fff;border-radius:2px"></span>
      </button>
      <nav style="display:{{ displayNav }};align-items:center;gap:clamp(18px,3vw,32px);flex-wrap:wrap">
        <a href="https://behance.net/visualvaro" target="_blank" title="behance.net/visualvaro" style="color:#E6E6E6;font-size:17px;letter-spacing:.02em" style-hover="color:#00AFEF">Portfólio</a>
        <a href="https://wa.me/5511966383580" target="_blank" title="11 96638-3580" style="color:#E6E6E6;font-size:17px;letter-spacing:.02em" style-hover="color:#00AFEF">WhatsApp</a>
        <a href="https://wa.me/5511966383580" target="_blank" style="color:#fff;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border-radius:999px;border:2px solid #fff;box-shadow:4px 4px 0 rgba(0,0,0,.35);white-space:nowrap;background:#0460E0;transition:transform .2s ease,box-shadow .2s ease" style-hover="color:#fff;transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.35)">Fazer um orçamento</a>
      </nav>
    </div>
    <sc-if value="{{ menuAberto }}" hint-placeholder-val="{{ false }}">
      <nav style="background:#001B42;border-top:1px solid rgba(255,255,255,.12);padding:4px clamp(20px,4vw,32px) 20px;display:flex;flex-direction:column">
        <a href="https://behance.net/visualvaro" target="_blank" onClick="{{ fecharMenu }}" style="color:#fff;font-weight:800;font-size:20px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.1)">Portfólio</a>
        <a href="https://wa.me/5511966383580" target="_blank" onClick="{{ fecharMenu }}" style="color:#fff;font-weight:800;font-size:20px;padding:16px 0">WhatsApp</a>
      </nav>
    </sc-if>
  </header>

  <main style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(48px,9vw,64px);padding:clamp(56px,12vw,96px) clamp(16px,5vw,24px)">
    <h1 style="margin:0;line-height:1.05;letter-spacing:-.01em;font-weight:400;max-width:none"><span style="display:block;font-size:clamp(24px,3.6vw,44px);font-weight:200">Estamos em obras</span><strong style="display:block;white-space:nowrap;font-size:clamp(26px,5.2vw,66px);font-weight:800;margin-top:.06em">site novo em breve</strong></h1>
    <div role="img" aria-label="Tomada e plugue desconectados" style="position:relative;width:min(100%,560px);aspect-ratio:970/709;animation:vvflutua 6.5s ease-in-out infinite">
      <img src="./assets/man-bola.png" alt="" style="position:absolute;left:20.6%;top:0;width:72%;height:auto">
      <img src="./assets/man-tomada.png" alt="" style="position:absolute;left:0;top:19.7%;width:43%;height:auto;transform-origin:50% 50%;animation:vvtomada 5.2s ease-in-out infinite">
      <img src="./assets/man-cabo.png" alt="" style="position:absolute;left:47%;top:40%;width:53%;height:auto;transform-origin:95% 95%;animation:vvcabo 5.2s ease-in-out infinite">
    </div>
    <p style="margin:0;font-size:clamp(20px,3vw,30px);color:rgba(255,255,255,.9)">Até breve.</p>
  </main>

  <footer style="background:#002963;color:#fff;padding:clamp(24px,4vw,32px) clamp(16px,5vw,24px);position:relative;overflow:hidden;border-top:1px solid rgba(255,255,255,.16)">
    <div style="position:absolute;inset:0;background-image:url('./assets/pattern.png');background-size:700px;opacity:.05;mix-blend-mode:screen"></div>
    <div style="position:relative;max-width:1240px;margin:0 auto">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
        <img src="./assets/logo-visualvaro.png" alt="visualvaro design gráfico e web" style="height:clamp(26px,3.4vw,36px);width:auto;display:block">
        <a href="https://wa.me/5511966383580" target="_blank" style="background:#15803D;color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 18px;border-radius:999px;border:2px solid #fff;box-shadow:4px 4px 0 rgba(0,0,0,.35);white-space:nowrap;transition:transform .2s ease,box-shadow .2s ease" style-hover="color:#fff;background:#0460E0;transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.35)">WhatsApp</a>
      </div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { mobile:false, menu:false };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 700px)');
    this.onMq = e => this.setState({ mobile: e.matches, menu: false });
    this.setState({ mobile: this.mq.matches });
    this.mq.addEventListener('change', this.onMq);
  }
  componentWillUnmount() { if (this.mq) this.mq.removeEventListener('change', this.onMq); }
  renderVals() {
    return {
      displayNav: this.state.mobile ? 'none' : 'flex',
      displayHamb: this.state.mobile ? 'flex' : 'none',
      menuAberto: this.state.mobile && this.state.menu,
      alternarMenu: () => this.setState(s => ({ menu: !s.menu })),
      fecharMenu: () => this.setState({ menu: false })
    };
  }
}
</script>
</body>
</html>
